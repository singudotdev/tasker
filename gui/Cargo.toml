[package]
name = "tasker-gui"
description = "tasker as a desktop app built with GPUI: the same tasks and markdown files as the terminal UI, with buttons and dialogs."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false
# tests/ holds this crate's unit tests, included into their modules with #[path], not integration tests.
autotests = false

[dependencies]
tasker-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
# GPUI from Zed 1.21.0: the crates.io release (0.2.2) can't draw on NVIDIA + Wayland
# (its Vulkan surface stays "out of date" and the window never updates). Newer GPUI isn't on crates.io.
# The `[patch]` entries Zed builds it with are in the workspace Cargo.toml.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.21.0", version = "0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.21.0", features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.21.0", version = "0.2.2", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
